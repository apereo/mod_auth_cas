name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apache2-dev \
            build-essential \
            libapr1-dev \
            check \
            libcurl4-openssl-dev \
            libpcre2-dev \
            libssl-dev \
            pkg-config

      - name: Configure
        run: ./configure --with-check

      - name: Build
        run: make

      - name: Run unit tests
        run: make check || (cat tests/test-suite.log && exit 1)
